<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F6F9"/>
      <stop offset="1" stop-color="#D7EAF4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Inventario de aplicaciones: grilla, dos tarjetas marcadas para racionalizar -->
  <g stroke="#046380" stroke-width="3.5">
    <rect x="130" y="100" width="56" height="56" rx="8" fill="#FFFFFF"/>
    <rect x="200" y="100" width="56" height="56" rx="8" fill="#FFFFFF"/>
    <rect x="130" y="170" width="56" height="56" rx="8" fill="#FFFFFF"/>
    <rect x="200" y="170" width="56" height="56" rx="8" fill="#0A7CB8" fill-opacity="0.15"/>
  </g>

  <!-- Redundancia detectada -->
  <path d="M212 182 L244 214 M244 182 L212 214" stroke="#AA6C0E" stroke-width="4" stroke-linecap="round"/>

  <!-- Consolidación -->
  <circle cx="158" cy="128" r="6" fill="#FAA92E"/>
  <path d="M270 128 L300 128" stroke="#046380" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <circle cx="308" cy="128" r="10" fill="none" stroke="#046380" stroke-width="4"/>
</svg>
