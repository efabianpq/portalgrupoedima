    <path d="M140 160 L160 210"/>
    <path d="M260 160 L240 210"/>
    <path d="M260 160 L290 210"/>
  </g>

  <circle cx="200" cy="100" r="14" fill="#046380"/>
  <g fill="#0A7CB8">
    <circle cx="140" cy="160" r="10"/>
    <circle cx="200" cy="160" r="10"/>
    <circle cx="260" cy="160" r="10"/>
  </g>
  <g fill="#FAA92E">
    <circle cx="110" cy="210" r="7"/>
    <circle cx="160" cy="210" r="7"/>
    <circle cx="240" cy="210" r="7"/>
    <circle cx="290" cy="210" r="7"/>
  </g>
