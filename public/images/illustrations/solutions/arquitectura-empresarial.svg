<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F6F9"/>
      <stop offset="1" stop-color="#D7EAF4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Mapa de capacidades: nodos conectados en niveles -->
  <g stroke="#046380" stroke-width="3" fill="none">
    <path d="M200 100 L140 160"/>
    <path d="M200 100 L200 160"/>
