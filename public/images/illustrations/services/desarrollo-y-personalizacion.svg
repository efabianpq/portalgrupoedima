<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F6F7"/>
      <stop offset="1" stop-color="#DDEAEE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Engranaje: extensión del metamodelo -->
  <g transform="translate(160,150)" fill="none" stroke="#046380" stroke-width="4" stroke-linejoin="round">
    <circle r="46"/>
    <g stroke-linecap="round">
      <path d="M0 -46 L0 -62"/>
      <path d="M0 46 L0 62"/>
      <path d="M-46 0 L-62 0"/>
      <path d="M46 0 L62 0"/>
      <path d="M-32.5 -32.5 L-43.8 -43.8"/>
      <path d="M32.5 32.5 L43.8 43.8"/>
      <path d="M-32.5 32.5 L-43.8 43.8"/>
      <path d="M32.5 -32.5 L43.8 -43.8"/>
    </g>
    <circle r="16" fill="#FFFFFF"/>
  </g>

  <!-- Pieza de integración -->
  <g transform="translate(268,168)" fill="#FFFFFF" stroke="#0A7CB8" stroke-width="4" stroke-linejoin="round">
    <rect x="-30" y="-30" width="60" height="60" rx="10"/>
    <circle cx="-30" cy="0" r="10" fill="#FAA92E" stroke="none"/>
  </g>
</svg>
