<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-hidden="true">
  <!-- Comunicación directa: líneas convergiendo en un punto de contacto. -->
  <g stroke="#046380" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round">
    <path d="M120 100 L200 150"/>
    <path d="M280 100 L200 150"/>
    <path d="M120 200 L200 150"/>
    <path d="M280 200 L200 150"/>
  </g>
  <g fill="#0A7CB8">
    <circle cx="120" cy="100" r="8"/>
    <circle cx="280" cy="100" r="8"/>
    <circle cx="120" cy="200" r="8"/>
    <circle cx="280" cy="200" r="8"/>
  </g>
  <circle cx="200" cy="150" r="16" fill="#FAA92E"/>
</svg>
